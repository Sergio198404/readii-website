    async function generateVideo(article) {
      // ── 1. 拉 Daisy 全部 segment audio ──
      setStatus(article.id, 'Loading Daisy audio...');
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuffers = [];
      for (let i = 0; i < article.segments.length; i++) {
        const seg = article.segments[i];
        const url = `${STORAGE_BASE}/article-audio/${seg.audio_filename}`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`Failed audio ${seg.audio_filename}: ${resp.status}`);
        const ab = await resp.arrayBuffer();
        const buf = await audioCtx.decodeAudioData(ab);
        audioBuffers.push(buf);
        setStatus(article.id, `Loading Daisy audio... ${i + 1}/${article.segments.length}`);
      }

      // ── 2. Stitch + 计算字幕时序 ──
      setStatus(article.id, 'Stitching audio...');
      const GAP_S = 0.2;
      const INTRO_S = 3;
      const OUTRO_S = 1;
      const sampleRate = audioBuffers[0].sampleRate;
      const channels = audioBuffers[0].numberOfChannels;

      // 主体内字幕时序(local elapsed):startTime/endTime 相对于 main body 开始
      const segmentInfo = [];
      let cum = 0;
      for (let i = 0; i < audioBuffers.length; i++) {
        const d = audioBuffers[i].duration;
        segmentInfo.push({ startTime: cum, endTime: cum + d + GAP_S });
        cum += d + GAP_S;
      }
      const mainDuration = cum;
      const totalDuration = INTRO_S + mainDuration + OUTRO_S;
      const totalSamples = Math.ceil(totalDuration * sampleRate);

      const offline = new OfflineAudioContext(channels, totalSamples, sampleRate);
      let off = INTRO_S;
      for (const b of audioBuffers) {
        const s = offline.createBufferSource();
        s.buffer = b;
        s.connect(offline.destination);
        s.start(off);
        off += b.duration + GAP_S;
      }
      const stitched = await offline.startRendering();
      console.log('stitched duration:', stitched.duration.toFixed(1), 's');

      // ── 2.5 Mix with BGM (Daisy 主声 + 柔和 lofi 背景) ──
      setStatus(article.id, 'Adding background music...');
      const finalAudio = await mixWithBGMMarketing(stitched);
      console.log('final mixed duration:', finalAudio.duration.toFixed(1), 's');

      // ── 3. Canvas + MediaRecorder 录 webm ──
      setStatus(article.id, 'Recording video (DO NOT switch tabs)...');
      showRecordingOverlay(totalDuration);

      const canvas = document.getElementById('renderCanvas');
      canvas.width = 1080;
      canvas.height = 1920;
      const c2d = canvas.getContext('2d');

      const playCtx = new (window.AudioContext || window.webkitAudioContext)();
      const audioSource = playCtx.createBufferSource();
      audioSource.buffer = finalAudio;
      const audioDest = playCtx.createMediaStreamDestination();
      audioSource.connect(audioDest);

      const videoStream = canvas.captureStream(30);
      const combined = new MediaStream();
      videoStream.getVideoTracks().forEach(t => combined.addTrack(t));
      audioDest.stream.getAudioTracks().forEach(t => combined.addTrack(t));

      const mimes = [
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];
      const mime = mimes.find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
      const chunks = [];
      const recorder = new MediaRecorder(combined, {
        mimeType: mime,
        videoBitsPerSecond: 4_000_000,    // 4 Mbps,适合 1080p marketing
        audioBitsPerSecond: 192_000
      });
      recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

      let didSwitchAway = false;
      const visHandler = () => { if (document.hidden) didSwitchAway = true; };
      document.addEventListener('visibilitychange', visHandler);

      const startTime = Date.now();
      const recordPromise = new Promise((resolve, reject) => {
        recorder.onstop = () => resolve(new Blob(chunks, { type: mime }));
        recorder.onerror = e => reject(new Error('MediaRecorder error: ' + (e.error?.message || 'unknown')));
      });

      recorder.start();
      audioSource.start(0);

      function renderLoop() {
        const elapsed = (Date.now() - startTime) / 1000;
        if (elapsed >= totalDuration) {
          if (recorder.state !== 'inactive') recorder.stop();
          return;
        }
        renderMarketingFrame(c2d, article, elapsed, totalDuration, INTRO_S, INTRO_S + mainDuration, segmentInfo);
        updateRecordingProgress(elapsed, totalDuration);
        requestAnimationFrame(renderLoop);
      }
      renderLoop();

      // 兜底超时
      const timeoutHandle = setTimeout(() => {
        if (recorder.state !== 'inactive') {
          try { recorder.stop(); } catch (e) {}
        }
      }, (totalDuration + 2) * 1000);

      const webmBlob = await recordPromise;
      clearTimeout(timeoutHandle);
      document.removeEventListener('visibilitychange', visHandler);
      hideRecordingOverlay();

      // ── 4. 损坏检测 ──
      const elapsedRecorded = (Date.now() - startTime) / 1000;
      const expected = totalDuration;
      console.log('recorded elapsed:', elapsedRecorded.toFixed(1), 'expected:', expected.toFixed(1));
      if (didSwitchAway) {
        throw new Error('Recording corrupted (tab was hidden). Please retry without switching tabs.');
      }
      if (elapsedRecorded < expected * 0.8) {
        throw new Error(`Recording too short (${elapsedRecorded.toFixed(1)}s vs expected ${expected.toFixed(1)}s). Please retry.`);
      }
      if (webmBlob.size < 100_000) {
        throw new Error(`Recording too small (${webmBlob.size} bytes). Likely corrupted.`);
      }

      // ── 5. 上传 webm 到 marketing-videos bucket ──
      setStatus(article.id, `Uploading webm (${(webmBlob.size / 1024 / 1024).toFixed(1)} MB)...`);
      const webmPath = `${article.id}-daisy.webm`;
      const { error: upErr } = await sb.storage.from(MARKETING_BUCKET).upload(webmPath, webmBlob, {
        contentType: 'video/webm',
        upsert: true
      });
      if (upErr) throw new Error('Upload failed: ' + upErr.message + ' (bucket may need anon write policy)');

      // ── 6. 触发 transcode-marketing-background ──
      const mp4Path = `${article.id}-daisy.mp4`;
      setStatus(article.id, 'Transcoding to mp4 (60-180s)...');
      try {
        await fetch('/.netlify/functions/transcode-marketing-background', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            bucket: MARKETING_BUCKET,
            inputPath: webmPath,
            outputPath: mp4Path
          })
        });
      } catch (e) {
        // Background function 返回 202 是预期,只在网络真的断时才进 catch
        console.log('transcode trigger network event:', e.message);
      }

      // ── 7. 轮询 mp4 ready ──
      const mp4Url = `${STORAGE_BASE}/${MARKETING_BUCKET}/${mp4Path}`;
      const startPoll = Date.now();
      const MAX_POLL_S = 600;  // 10 分钟兜底(高质量 1080p medium-fast 编码可能需要 3-6 分钟)
      while ((Date.now() - startPoll) / 1000 < MAX_POLL_S) {
        await sleep(5000);
        try {
          const resp = await fetch(mp4Url, { method: 'HEAD', cache: 'no-cache' });
          if (resp.ok) {
            const lastMod = resp.headers.get('last-modified');
            // 必须是新文件(刚转码完的)而不是旧的同名文件
            // 简单判断:upload 完成时间之后的文件
            const modTime = lastMod ? new Date(lastMod).getTime() : 0;
            if (modTime > startTime - 10000) {
              setStatus(article.id, '✓ Generated', 'ok');
              updateDownloadStatus(article.id, mp4Url + '?t=' + Date.now(), 'just now');
              return;
            }
          }
          const sec = Math.round((Date.now() - startPoll) / 1000);
          setStatus(article.id, `Transcoding to mp4... (${sec}s elapsed)`);
        } catch (e) {}
      }
      throw new Error('Transcode polling timed out. Check Netlify Functions log for transcode-marketing-background.');
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

    // ───────────────────── BGM MIX ─────────────────────
    // Daisy 朗读 + lofi 背景:user gain 0.88,bgm peak 0.08,1s 渐入,末尾 2s 渐出
    let __cachedBgmBuffer = null;
    async function mixWithBGMMarketing(userBuffer) {
      try {
        if (!__cachedBgmBuffer) {
          const resp = await fetch(BGM_URL);
          if (!resp.ok) {
            console.warn('BGM fetch failed:', resp.status, '— skipping BGM');
            return userBuffer;
          }
          const ab = await resp.arrayBuffer();
          const tmpCtx = new (window.AudioContext || window.webkitAudioContext)();
          __cachedBgmBuffer = await tmpCtx.decodeAudioData(ab);
        }
        const bgmBuffer = __cachedBgmBuffer;

        const sampleRate = userBuffer.sampleRate;
        const totalDuration = userBuffer.duration;
        const channels = userBuffer.numberOfChannels;
        const totalSamples = Math.ceil(totalDuration * sampleRate);

        const offline = new OfflineAudioContext(channels, totalSamples, sampleRate);

        // Daisy 主声 track
        const userSrc = offline.createBufferSource();
        userSrc.buffer = userBuffer;
        const userGain = offline.createGain();
        userGain.gain.value = 0.88;
        userSrc.connect(userGain);
        userGain.connect(offline.destination);
        userSrc.start(0);

        // BGM track:loop 铺满,1s 渐入,末尾 2s 渐出
        const bgmSrc = offline.createBufferSource();
        bgmSrc.buffer = bgmBuffer;
        bgmSrc.loop = true;
        const bgmGain = offline.createGain();
        const peak = 0.08;
        bgmGain.gain.setValueAtTime(0, 0);
        bgmGain.gain.linearRampToValueAtTime(peak, 1.0);
        bgmGain.gain.setValueAtTime(peak, Math.max(1.0, totalDuration - 2.0));
        bgmGain.gain.linearRampToValueAtTime(0, totalDuration);
        bgmSrc.connect(bgmGain);
        bgmGain.connect(offline.destination);
        bgmSrc.start(0);
        bgmSrc.stop(totalDuration);

        return await offline.startRendering();
      } catch (e) {
        console.warn('BGM mix failed, falling back to dry audio:', e);
        return userBuffer;
      }
    }

    // ───────────────────── RECORDING OVERLAY ─────────────────────
    function showRecordingOverlay(totalSec) {
      document.body.classList.add('recording-active');
      document.getElementById('recordingOverlay').classList.add('show');
      document.getElementById('progBar').style.width = '0%';
      document.getElementById('elapsedTime').textContent = '0:00 / ' + fmtTime(totalSec);
    }
    function hideRecordingOverlay() {
      document.body.classList.remove('recording-active');
      document.getElementById('recordingOverlay').classList.remove('show');
    }
    function updateRecordingProgress(elapsed, total) {
      const pct = Math.min(100, (elapsed / total) * 100);
      document.getElementById('progBar').style.width = pct + '%';
      document.getElementById('elapsedTime').textContent = fmtTime(elapsed) + ' / ' + fmtTime(total);
    }
    function fmtTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    // ───────────────────── CANVAS RENDER ─────────────────────
    function renderMarketingFrame(ctx, article, elapsed, totalDuration, mainStart, mainEnd, segmentInfo) {
      const W = 1080, H = 1920;

      // 背景渐变(跟 /quiz 一致)
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#1F4D40');
      grad.addColorStop(0.5, '#2D5A4F');
      grad.addColorStop(1, '#0F2520');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      // 微妙金色纹理
      ctx.fillStyle = 'rgba(184, 135, 58, 0.04)';
      ctx.fillRect(0, 0, W, H);

      if (elapsed < mainStart) {
        renderIntroCard(ctx, article, elapsed, mainStart);
      } else if (elapsed >= mainEnd) {
        renderOutroCard(ctx, elapsed - mainEnd, totalDuration - mainEnd);
      } else {
        renderMainBody(ctx, article, elapsed - mainStart, segmentInfo);
      }
    }

    function renderIntroCard(ctx, article, elapsed, duration) {
      const W = 1080, H = 1920;
      // v12: 不淡入(社交媒体抓第一帧做封面,淡入会让封面是空屏)
      // 顶部 brand
      ctx.fillStyle = '#B8873A';
      ctx.font = '700 36px "Helvetica Neue", Helvetica, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('READII · READ BRITISH', W / 2, 240);

      ctx.strokeStyle = 'rgba(184, 135, 58, 0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(W / 2 - 200, 280);
      ctx.lineTo(W / 2 + 200, 280);
      ctx.stroke();

      // 文章标题
      ctx.fillStyle = '#FAF8F3';
      ctx.font = 'italic 88px Georgia, serif';
      ctx.fillText(article.title, W / 2, H / 2 - 80);

      ctx.strokeStyle = 'rgba(184, 135, 58, 0.4)';
      ctx.beginPath();
      ctx.moveTo(W / 2 - 60, H / 2 - 20);
      ctx.lineTo(W / 2 + 60, H / 2 - 20);
      ctx.stroke();

      ctx.fillStyle = 'rgba(250, 248, 243, 0.7)';
      ctx.font = 'italic 36px Georgia, serif';
      ctx.fillText('by ' + article.author, W / 2, H / 2 + 40);

      // 手写体 "a Daisy reading"
      ctx.fillStyle = '#B8873A';
      ctx.font = '500 64px Caveat, Georgia, cursive';
      ctx.fillText('a Daisy reading', W / 2, H / 2 + 220);
    }

    function renderMainBody(ctx, article, localElapsed, segmentInfo) {
      const W = 1080, H = 1920;

      // 顶部 brand
      ctx.fillStyle = '#B8873A';
      ctx.font = '700 52px "Helvetica Neue", Helvetica, sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(184, 135, 58, 0.3)';
      ctx.shadowBlur = 12;
      ctx.fillText('READII', W / 2, 130);
      ctx.shadowBlur = 0;

      ctx.fillStyle = 'rgba(250, 248, 243, 0.75)';
      ctx.font = 'italic 24px Georgia, serif';
      ctx.fillText('Read British', W / 2, 170);

      ctx.strokeStyle = 'rgba(184, 135, 58, 0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(W / 2 - 80, 200);
      ctx.lineTo(W / 2 + 80, 200);
      ctx.stroke();

      // Daisy reads
      ctx.fillStyle = '#FAF8F3';
      ctx.font = '700 56px Georgia, serif';
      ctx.fillText('Daisy', W / 2, 280);

      ctx.fillStyle = 'rgba(250, 248, 243, 0.6)';
      ctx.font = '300 26px "Helvetica Neue", sans-serif';
      ctx.fillText('reads', W / 2, 322);

      // 文章标题
      ctx.fillStyle = '#FAF8F3';
      ctx.font = 'italic 46px Georgia, serif';
      ctx.fillText(article.title, W / 2, 400);

      // 字幕(基于 localElapsed 切换 segment)
      renderKaraokeFromSegments(ctx, article.segments, segmentInfo, localElapsed, W, H);
    }

    function renderKaraokeFromSegments(ctx, segments, segInfo, localElapsed, W, H) {
      let activeIdx = -1;
      for (let i = 0; i < segInfo.length; i++) {
        if (localElapsed >= segInfo[i].startTime && localElapsed < segInfo[i].endTime) {
          activeIdx = i;
          break;
        }
      }
      if (activeIdx === -1 && segments.length > 0) {
        activeIdx = segments.length - 1;
      }
      const active = segments[activeIdx];
      if (!active) return;

      // 当前句 — 大白字 + gold 阴影
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'italic 700 60px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(184, 135, 58, 0.4)';
      ctx.shadowBlur = 20;

      const words = active.text.split(/\s+/);
      const maxWidth = W - 160;
      const lines = [];
      let currentLine = '';
      for (const w of words) {
        const test = currentLine ? currentLine + ' ' + w : w;
        if (ctx.measureText(test).width > maxWidth && currentLine) {
          lines.push(currentLine);
          currentLine = w;
        } else {
          currentLine = test;
        }
      }
      if (currentLine) lines.push(currentLine);

      const lineHeight = 80;
      const totalH = lines.length * lineHeight;
      const startY = H / 2 - totalH / 2 + 80;
      lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, startY + i * lineHeight);
      });
      ctx.shadowBlur = 0;

      // 上下虚影
      ctx.font = '300 36px Georgia, serif';
      ctx.fillStyle = 'rgba(250, 248, 243, 0.3)';
      if (activeIdx > 0) {
        const prev = segments[activeIdx - 1].text;
        const prevShort = prev.length > 80 ? prev.slice(0, 80) + '…' : prev;
        ctx.fillText(prevShort, W / 2, startY - 100);
      }
      if (activeIdx < segments.length - 1) {
        const next = segments[activeIdx + 1].text;
        const nextShort = next.length > 80 ? next.slice(0, 80) + '…' : next;
        ctx.fillText(nextShort, W / 2, startY + totalH + 60);
      }
    }

    function renderOutroCard(ctx, localElapsed, duration) {
      const W = 1080, H = 1920;
      const alpha = Math.min(1, localElapsed / 0.3);
      ctx.globalAlpha = alpha;

      // 巨大 READII
      ctx.fillStyle = '#B8873A';
      ctx.font = '700 96px "Helvetica Neue", Helvetica, sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(184, 135, 58, 0.5)';
      ctx.shadowBlur = 24;
      ctx.fillText('READII', W / 2, H / 2 - 20);
      ctx.shadowBlur = 0;

      ctx.strokeStyle = 'rgba(184, 135, 58, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(W / 2 - 70, H / 2 + 30);
      ctx.lineTo(W / 2 + 70, H / 2 + 30);
      ctx.stroke();

      ctx.fillStyle = '#FAF8F3';
      ctx.font = 'italic 34px Georgia, serif';
      ctx.fillText('Read British', W / 2, H / 2 + 100);

      ctx.globalAlpha = 1;
    }
  </script>
