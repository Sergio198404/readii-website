<!-- admin/marketing-videos.html — Readii Marketing Video Generator (browser-based MVP) -->
<!--
  URL: /admin/marketing-videos.html?key=READII_MARKETING_2026
  生成流程:
    1. 拉 Daisy article-audio segments
    2. stitch + 计算 segment 时序
    3. Canvas 1080x1920 + MediaRecorder 实时录 webm
    4. 上传到 marketing-videos bucket
    5. 触发 transcode-marketing-background → mp4
    6. 轮询 mp4 ready → 显示下载链接
-->

  <script>
    // ───────────────────── CONFIG ─────────────────────
    const ADMIN_KEY = 'READII_MARKETING_2026';
    const SUPABASE_URL = 'https://bltfljdgjxhcmbfduert.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJsdGZsamRnanhoY21iZmR1ZXJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjQwMDMsImV4cCI6MjA5MTM0MDAwM30.WL8e6w1x_Bz437jtke8ZhFF0GpBo2WlG5-7wvLm8o2s';
    // STORAGE_BASE 来自 /data/articles.js(避免重复声明冲突)
    const MARKETING_BUCKET = 'marketing-videos';
    const BGM_URL = `${STORAGE_BASE}/bgm-audio/bgm-lofi.mp3`;

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // ─────────── ARTICLES_DATA (admin 用,简化版) ───────────
    // 只含市场视频生成需要的字段:id, title, author, segments[].text, segments[].audio_filename
    // 加文章时这里和 quiz/index.html 都要加(目前 3 篇,可接受)
    // ===========================================================
    // ARTICLES_DATA moved to /data/articles.js (loaded via <script src> above).
    // Available as window.ARTICLES_DATA - same source as quiz/index.html.
    // ===========================================================

    // ───────────────────── AUTH GATE ─────────────────────
    const urlKey = new URLSearchParams(location.search).get('key');
    if (urlKey === ADMIN_KEY) {
      document.getElementById('authGate').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      init();
    }

    // ───────────────────── RENDER UI ─────────────────────
    async function init() {
      // 等字体加载完(Canvas 渲染依赖)
      try {
        await document.fonts.load('500 56px Caveat');
        await document.fonts.ready;
      } catch (e) { console.warn('fonts.load:', e); }

      renderArticleList();
    }

    function renderArticleList() {
      const list = document.getElementById('articleList');
      list.innerHTML = Object.values(ARTICLES_DATA).map(article => {
        const hasQuoteCards = !!(window.QUOTE_CARDS && window.QUOTE_CARDS[article.id]);
        const numCards = hasQuoteCards ? window.QUOTE_CARDS[article.id].length : 0;
        return `
        <div class="article-card" data-article-id="${article.id}">
          <h3 class="article-title">${escapeHtml(article.title)}</h3>
          <p class="article-meta">${article.segments.length} segments · by ${escapeHtml(article.author)}</p>
          <div class="article-actions">
            <button class="btn" onclick="onGenerateClick('${article.id}')">Generate video</button>
            <span class="download-status"></span>
          </div>
          <div class="status"></div>

          ${hasQuoteCards ? `
          <div class="quote-section">
            <div class="quote-section-header">
              <p class="quote-section-label">📸 Quote Cards (${numCards})</p>
              <div class="quote-section-actions">
                <button class="btn-small" onclick="generateAllQuoteCards('${article.id}')">Generate all</button>
                <button class="btn-small" id="zipBtn-${article.id}" onclick="downloadZipForArticle('${article.id}')" disabled>⬇ ZIP</button>
              </div>
            </div>
            <div class="quote-grid" id="quoteGrid-${article.id}">
              ${window.QUOTE_CARDS[article.id].map((card, i) => `
                <div class="quote-thumb pending" data-slug="${article.id}" data-idx="${card.card_index}" onclick="generateSingleCardAndDownload('${article.id}', ${card.card_index})">
                  <span>${card.card_index} · ${card.type === 'phrase' ? 'phrase' : card.type === 'carousel-cover' ? 'cover' : 'phoneme'}</span>
                </div>
              `).join('')}
            </div>
            <div class="status" id="quoteStatus-${article.id}"></div>
          </div>
          ` : ''}
        </div>
      `;
      }).join('');

      // 检查 marketing-videos bucket 里已有的 mp4
      checkExistingVideos();
    }

    async function checkExistingVideos() {
      for (const id of Object.keys(ARTICLES_DATA)) {
        const mp4Url = `${STORAGE_BASE}/${MARKETING_BUCKET}/${id}-daisy.mp4`;
        try {
          const resp = await fetch(mp4Url, { method: 'HEAD' });
          if (resp.ok) {
            updateDownloadStatus(id, mp4Url, 'existing');
          }
        } catch (e) {}
      }
    }

    function updateDownloadStatus(articleId, mp4Url, label) {
      const card = document.querySelector(`[data-article-id="${articleId}"]`);
      if (!card) return;
      const span = card.querySelector('.download-status');
      span.innerHTML = `<a href="${mp4Url}" target="_blank" download class="download-link">⬇ Download mp4 ${label ? '· ' + label : ''}</a>`;
    }

    function setStatus(articleId, text, kind) {
      const card = document.querySelector(`[data-article-id="${articleId}"]`);
      if (!card) return;
      const s = card.querySelector('.status');
      s.className = 'status' + (kind ? ' ' + kind : '');
      s.textContent = text;
    }

    function setButtonDisabled(articleId, disabled) {
      const card = document.querySelector(`[data-article-id="${articleId}"]`);
      if (!card) return;
      const btn = card.querySelector('.btn');
      btn.disabled = disabled;
    }

    // ───────────────────── GENERATE ─────────────────────
    let generating = false;

    async function onGenerateClick(articleId) {
      if (generating) { alert('Another video is being generated.'); return; }
      const article = ARTICLES_DATA[articleId];
      if (!article) return;

      generating = true;
      setButtonDisabled(articleId, true);

      try {
        await generateVideo(article);
      } catch (err) {
        console.error('Generate failed:', err);
        setStatus(articleId, '✕ ' + err.message, 'err');
      } finally {
        generating = false;
        setButtonDisabled(articleId, false);
      }
    }

    window.onGenerateClick = onGenerateClick;

    async function generateVideo(article) {
      // ── 1. 拉 Daisy 全部 segment audio ──
      setStatus(article.id, 'Loading Daisy audio...');
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuffers = [];
      for (let i = 0; i < article.segments.length; i++) {
        const seg = article.segments[i];
        const url = `${STORAGE_BASE}/article-audio/${seg.audio_filename}`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`Failed audio ${seg.audio_filename}: ${resp.status}`);
        const ab = await resp.arrayBuffer();
        const buf = await audioCtx.decodeAudioData(ab);
        audioBuffers.push(buf);
        setStatus(article.id, `Loading Daisy audio... ${i + 1}/${article.segments.length}`);
      }

      // ── 2. Stitch + 计算字幕时序 ──
      setStatus(article.id, 'Stitching audio...');
      const GAP_S = 0.2;
      const INTRO_S = 3;
      const OUTRO_S = 1;
      const sampleRate = audioBuffers[0].sampleRate;
      const channels = audioBuffers[0].numberOfChannels;

      // 主体内字幕时序(local elapsed):startTime/endTime 相对于 main body 开始
      const segmentInfo = [];
      let cum = 0;
      for (let i = 0; i < audioBuffers.length; i++) {
        const d = audioBuffers[i].duration;
        segmentInfo.push({ startTime: cum, endTime: cum + d + GAP_S });
        cum += d + GAP_S;
      }
      const mainDuration = cum;
      const totalDuration = INTRO_S + mainDuration + OUTRO_S;
      const totalSamples = Math.ceil(totalDuration * sampleRate);

      const offline = new OfflineAudioContext(channels, totalSamples, sampleRate);
      let off = INTRO_S;
      for (const b of audioBuffers) {
        const s = offline.createBufferSource();
        s.buffer = b;
        s.connect(offline.destination);
        s.start(off);
        off += b.duration + GAP_S;
      }
      const stitched = await offline.startRendering();
      console.log('stitched duration:', stitched.duration.toFixed(1), 's');

      // ── 2.5 Mix with BGM (Daisy 主声 + 柔和 lofi 背景) ──
      setStatus(article.id, 'Adding background music...');
      const finalAudio = await mixWithBGMMarketing(stitched);
      console.log('final mixed duration:', finalAudio.duration.toFixed(1), 's');

      // ── 3. Canvas + MediaRecorder 录 webm ──
      setStatus(article.id, 'Recording video (DO NOT switch tabs)...');
      showRecordingOverlay(totalDuration);

      const canvas = document.getElementById('renderCanvas');
      canvas.width = 1080;
      canvas.height = 1920;
      const c2d = canvas.getContext('2d');

      const playCtx = new (window.AudioContext || window.webkitAudioContext)();
      const audioSource = playCtx.createBufferSource();
      audioSource.buffer = finalAudio;
      const audioDest = playCtx.createMediaStreamDestination();
      audioSource.connect(audioDest);

      const videoStream = canvas.captureStream(30);
      const combined = new MediaStream();
      videoStream.getVideoTracks().forEach(t => combined.addTrack(t));
      audioDest.stream.getAudioTracks().forEach(t => combined.addTrack(t));

      const mimes = [
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];
      const mime = mimes.find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
      const chunks = [];
      const recorder = new MediaRecorder(combined, {
        mimeType: mime,
        videoBitsPerSecond: 4_000_000,    // 4 Mbps,适合 1080p marketing
        audioBitsPerSecond: 192_000
      });
      recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

      let didSwitchAway = false;
      const visHandler = () => { if (document.hidden) didSwitchAway = true; };
      document.addEventListener('visibilitychange', visHandler);

      const startTime = Date.now();
      const recordPromise = new Promise((resolve, reject) => {
        recorder.onstop = () => resolve(new Blob(chunks, { type: mime }));
        recorder.onerror = e => reject(new Error('MediaRecorder error: ' + (e.error?.message || 'unknown')));
      });

      recorder.start();
      audioSource.start(0);

      function renderLoop() {
        const elapsed = (Date.now() - startTime) / 1000;
        if (elapsed >= totalDuration) {
          if (recorder.state !== 'inactive') recorder.stop();
          return;
        }
        renderMarketingFrame(c2d, article, elapsed, totalDuration, INTRO_S, INTRO_S + mainDuration, segmentInfo);
        updateRecordingProgress(elapsed, totalDuration);
        requestAnimationFrame(renderLoop);
      }
      renderLoop();

      // 兜底超时
      const timeoutHandle = setTimeout(() => {
        if (recorder.state !== 'inactive') {
          try { recorder.stop(); } catch (e) {}
        }
      }, (totalDuration + 2) * 1000);

      const webmBlob = await recordPromise;
      clearTimeout(timeoutHandle);
      document.removeEventListener('visibilitychange', visHandler);
      hideRecordingOverlay();

      // ── 4. 损坏检测 ──
      const elapsedRecorded = (Date.now() - startTime) / 1000;
      const expected = totalDuration;
      console.log('recorded elapsed:', elapsedRecorded.toFixed(1), 'expected:', expected.toFixed(1));
      if (didSwitchAway) {
        throw new Error('Recording corrupted (tab was hidden). Please retry without switching tabs.');
      }
      if (elapsedRecorded < expected * 0.8) {
        throw new Error(`Recording too short (${elapsedRecorded.toFixed(1)}s vs expected ${expected.toFixed(1)}s). Please retry.`);
      }
      if (webmBlob.size < 100_000) {
        throw new Error(`Recording too small (${webmBlob.size} bytes). Likely corrupted.`);
      }

      // ── 5. 上传 webm 到 marketing-videos bucket ──
      setStatus(article.id, `Uploading webm (${(webmBlob.size / 1024 / 1024).toFixed(1)} MB)...`);
      const webmPath = `${article.id}-daisy.webm`;
      const { error: upErr } = await sb.storage.from(MARKETING_BUCKET).upload(webmPath, webmBlob, {
        contentType: 'video/webm',
        upsert: true
      });
      if (upErr) throw new Error('Upload failed: ' + upErr.message + ' (bucket may need anon write policy)');

      // ── 6. 触发 transcode-marketing-background ──
      const mp4Path = `${article.id}-daisy.mp4`;
      setStatus(article.id, 'Transcoding to mp4 (60-180s)...');
      try {
        await fetch('/.netlify/functions/transcode-marketing-background', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            bucket: MARKETING_BUCKET,
            inputPath: webmPath,
            outputPath: mp4Path
          })
        });
      } catch (e) {
        // Background function 返回 202 是预期,只在网络真的断时才进 catch
        console.log('transcode trigger network event:', e.message);
      }

      // ── 7. 轮询 mp4 ready ──
      const mp4Url = `${STORAGE_BASE}/${MARKETING_BUCKET}/${mp4Path}`;
      const startPoll = Date.now();
      const MAX_POLL_S = 600;  // 10 分钟兜底(高质量 1080p medium-fast 编码可能需要 3-6 分钟)
      while ((Date.now() - startPoll) / 1000 < MAX_POLL_S) {
        await sleep(5000);
        try {
          const resp = await fetch(mp4Url, { method: 'HEAD', cache: 'no-cache' });
          if (resp.ok) {
            const lastMod = resp.headers.get('last-modified');
            // 必须是新文件(刚转码完的)而不是旧的同名文件
            // 简单判断:upload 完成时间之后的文件
            const modTime = lastMod ? new Date(lastMod).getTime() : 0;
            if (modTime > startTime - 10000) {
              setStatus(article.id, '✓ Generated', 'ok');
              updateDownloadStatus(article.id, mp4Url + '?t=' + Date.now(), 'just now');
              return;
            }
          }
          const sec = Math.round((Date.now() - startPoll) / 1000);
          setStatus(article.id, `Transcoding to mp4... (${sec}s elapsed)`);
        } catch (e) {}
      }
      throw new Error('Transcode polling timed out. Check Netlify Functions log for transcode-marketing-background.');
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

    // ───────────────────── BGM MIX ─────────────────────
    // Daisy 朗读 + lofi 背景:user gain 0.88,bgm peak 0.08,1s 渐入,末尾 2s 渐出
    let __cachedBgmBuffer = null;
    async function mixWithBGMMarketing(userBuffer) {
      try {
        if (!__cachedBgmBuffer) {
          const resp = await fetch(BGM_URL);
          if (!resp.ok) {
            console.warn('BGM fetch failed:', resp.status, '— skipping BGM');
            return userBuffer;
          }
          const ab = await resp.arrayBuffer();
          const tmpCtx = new (window.AudioContext || window.webkitAudioContext)();
          __cachedBgmBuffer = await tmpCtx.decodeAudioData(ab);
        }
        const bgmBuffer = __cachedBgmBuffer;

        const sampleRate = userBuffer.sampleRate;
        const totalDuration = userBuffer.duration;
        const channels = userBuffer.numberOfChannels;
        const totalSamples = Math.ceil(totalDuration * sampleRate);

        const offline = new OfflineAudioContext(channels, totalSamples, sampleRate);

        // Daisy 主声 track
        const userSrc = offline.createBufferSource();
        userSrc.buffer = userBuffer;
        const userGain = offline.createGain();
        userGain.gain.value = 0.88;
        userSrc.connect(userGain);
        userGain.connect(offline.destination);
        userSrc.start(0);

        // BGM track:loop 铺满,1s 渐入,末尾 2s 渐出
        const bgmSrc = offline.createBufferSource();
        bgmSrc.buffer = bgmBuffer;
        bgmSrc.loop = true;
        const bgmGain = offline.createGain();
        const peak = 0.08;
        bgmGain.gain.setValueAtTime(0, 0);
        bgmGain.gain.linearRampToValueAtTime(peak, 1.0);
        bgmGain.gain.setValueAtTime(peak, Math.max(1.0, totalDuration - 2.0));
        bgmGain.gain.linearRampToValueAtTime(0, totalDuration);
        bgmSrc.connect(bgmGain);
        bgmGain.connect(offline.destination);
        bgmSrc.start(0);
        bgmSrc.stop(totalDuration);

        return await offline.startRendering();
      } catch (e) {
        console.warn('BGM mix failed, falling back to dry audio:', e);
        return userBuffer;
      }
    }

    // ───────────────────── RECORDING OVERLAY ─────────────────────
    function showRecordingOverlay(totalSec) {
      document.body.classList.add('recording-active');
      document.getElementById('recordingOverlay').classList.add('show');
      document.getElementById('progBar').style.width = '0%';
      document.getElementById('elapsedTime').textContent = '0:00 / ' + fmtTime(totalSec);
    }
    function hideRecordingOverlay() {
      document.body.classList.remove('recording-active');
      document.getElementById('recordingOverlay').classList.remove('show');
    }
    function updateRecordingProgress(elapsed, total) {
      const pct = Math.min(100, (elapsed / total) * 100);
      document.getElementById('progBar').style.width = pct + '%';
      document.getElementById('elapsedTime').textContent = fmtTime(elapsed) + ' / ' + fmtTime(total);
    }
    function fmtTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    // ───────────────────── CANVAS RENDER ─────────────────────
    function renderMarketingFrame(ctx, article, elapsed, totalDuration, mainStart, mainEnd, segmentInfo) {
      const W = 1080, H = 1920;

      // 背景渐变(跟 /quiz 一致)
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#1F4D40');
      grad.addColorStop(0.5, '#2D5A4F');
      grad.addColorStop(1, '#0F2520');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      // 微妙金色纹理
      ctx.fillStyle = 'rgba(184, 135, 58, 0.04)';
      ctx.fillRect(0, 0, W, H);

      if (elapsed < mainStart) {
        renderIntroCard(ctx, article, elapsed, mainStart);
      } else if (elapsed >= mainEnd) {
        renderOutroCard(ctx, elapsed - mainEnd, totalDuration - mainEnd);
      } else {
        renderMainBody(ctx, article, elapsed - mainStart, segmentInfo);
      }
    }

    function renderIntroCard(ctx, article, elapsed, duration) {
      const W = 1080, H = 1920;
      // v12: 不淡入(社交媒体抓第一帧做封面,淡入会让封面是空屏)
      // 顶部 brand
      ctx.fillStyle = '#B8873A';
      ctx.font = '700 36px "Helvetica Neue", Helvetica, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('READII · READ BRITISH', W / 2, 240);

      ctx.strokeStyle = 'rgba(184, 135, 58, 0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(W / 2 - 200, 280);
      ctx.lineTo(W / 2 + 200, 280);
      ctx.stroke();

      // 文章标题
      ctx.fillStyle = '#FAF8F3';
      ctx.font = 'italic 88px Georgia, serif';
      ctx.fillText(article.title, W / 2, H / 2 - 80);

      ctx.strokeStyle = 'rgba(184, 135, 58, 0.4)';
      ctx.beginPath();
      ctx.moveTo(W / 2 - 60, H / 2 - 20);
      ctx.lineTo(W / 2 + 60, H / 2 - 20);
      ctx.stroke();

      ctx.fillStyle = 'rgba(250, 248, 243, 0.7)';
      ctx.font = 'italic 36px Georgia, serif';
      ctx.fillText('by ' + article.author, W / 2, H / 2 + 40);

      // 手写体 "a Daisy reading"
      ctx.fillStyle = '#B8873A';
      ctx.font = '500 64px Caveat, Georgia, cursive';
      ctx.fillText('a Daisy reading', W / 2, H / 2 + 220);
    }

    function renderMainBody(ctx, article, localElapsed, segmentInfo) {
      const W = 1080, H = 1920;

      // 顶部 brand
      ctx.fillStyle = '#B8873A';
      ctx.font = '700 52px "Helvetica Neue", Helvetica, sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(184, 135, 58, 0.3)';
      ctx.shadowBlur = 12;
      ctx.fillText('READII', W / 2, 130);
      ctx.shadowBlur = 0;

      ctx.fillStyle = 'rgba(250, 248, 243, 0.75)';
      ctx.font = 'italic 24px Georgia, serif';
      ctx.fillText('Read British', W / 2, 170);

      ctx.strokeStyle = 'rgba(184, 135, 58, 0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(W / 2 - 80, 200);
      ctx.lineTo(W / 2 + 80, 200);
      ctx.stroke();

      // Daisy reads
      ctx.fillStyle = '#FAF8F3';
      ctx.font = '700 56px Georgia, serif';
      ctx.fillText('Daisy', W / 2, 280);

      ctx.fillStyle = 'rgba(250, 248, 243, 0.6)';
      ctx.font = '300 26px "Helvetica Neue", sans-serif';
      ctx.fillText('reads', W / 2, 322);

      // 文章标题
      ctx.fillStyle = '#FAF8F3';
      ctx.font = 'italic 46px Georgia, serif';
      ctx.fillText(article.title, W / 2, 400);

      // 字幕(基于 localElapsed 切换 segment)
      renderKaraokeFromSegments(ctx, article.segments, segmentInfo, localElapsed, W, H);
    }

    function renderKaraokeFromSegments(ctx, segments, segInfo, localElapsed, W, H) {
      let activeIdx = -1;
      for (let i = 0; i < segInfo.length; i++) {
        if (localElapsed >= segInfo[i].startTime && localElapsed < segInfo[i].endTime) {
          activeIdx = i;
          break;
        }
      }
      if (activeIdx === -1 && segments.length > 0) {
        activeIdx = segments.length - 1;
      }
      const active = segments[activeIdx];
      if (!active) return;

      // 当前句 — 大白字 + gold 阴影
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'italic 700 60px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(184, 135, 58, 0.4)';
      ctx.shadowBlur = 20;

      const words = active.text.split(/\s+/);
      const maxWidth = W - 160;
      const lines = [];
      let currentLine = '';
      for (const w of words) {
        const test = currentLine ? currentLine + ' ' + w : w;
        if (ctx.measureText(test).width > maxWidth && currentLine) {
          lines.push(currentLine);
          currentLine = w;
        } else {
          currentLine = test;
        }
      }
      if (currentLine) lines.push(currentLine);

      const lineHeight = 80;
      const totalH = lines.length * lineHeight;
      const startY = H / 2 - totalH / 2 + 80;
      lines.forEach((line, i) => {
        ctx.fillText(line, W / 2, startY + i * lineHeight);
      });
      ctx.shadowBlur = 0;

      // 上下虚影
      ctx.font = '300 36px Georgia, serif';
      ctx.fillStyle = 'rgba(250, 248, 243, 0.3)';
      if (activeIdx > 0) {
        const prev = segments[activeIdx - 1].text;
        const prevShort = prev.length > 80 ? prev.slice(0, 80) + '…' : prev;
        ctx.fillText(prevShort, W / 2, startY - 100);
      }
      if (activeIdx < segments.length - 1) {
        const next = segments[activeIdx + 1].text;
        const nextShort = next.length > 80 ? next.slice(0, 80) + '…' : next;
        ctx.fillText(nextShort, W / 2, startY + totalH + 60);
      }
    }

    function renderOutroCard(ctx, localElapsed, duration) {
      const W = 1080, H = 1920;
      const alpha = Math.min(1, localElapsed / 0.3);
      ctx.globalAlpha = alpha;

      // 巨大 READII
      ctx.fillStyle = '#B8873A';
      ctx.font = '700 96px "Helvetica Neue", Helvetica, sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(184, 135, 58, 0.5)';
      ctx.shadowBlur = 24;
      ctx.fillText('READII', W / 2, H / 2 - 20);
      ctx.shadowBlur = 0;

      ctx.strokeStyle = 'rgba(184, 135, 58, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(W / 2 - 70, H / 2 + 30);
      ctx.lineTo(W / 2 + 70, H / 2 + 30);
      ctx.stroke();

      ctx.fillStyle = '#FAF8F3';
      ctx.font = 'italic 34px Georgia, serif';
      ctx.fillText('Read British', W / 2, H / 2 + 100);

      ctx.globalAlpha = 1;
    }

    // ════════════════════════════════════════════════════════════════════
    // Quote Cards — Canvas 1080×1920 PNG renderer (Phase 1)
    // ════════════════════════════════════════════════════════════════════

    const CARD_W = 1080;
    const CARD_H = 1920;
    const COLOR = {
      bg: '#FAF7F0',
      green: '#1B4D3E',
      gold: '#B89968',
      body: '#4A4640',
      muted: '#8A8579',
      faded: '#A8A29A',
      divider: '#E8E0D0'
    };

    let quoteFontsLoaded = false;
    async function loadQuoteFonts() {
      if (quoteFontsLoaded) return;
      try {
        await Promise.all([
          document.fonts.load('600 64px Lora'),
          document.fonts.load('700 96px Lora'),
          document.fonts.load('500 42px "IBM Plex Mono"'),
          document.fonts.load('500 56px "IBM Plex Mono"'),
          document.fonts.load('400 32px "Noto Serif SC"'),
          document.fonts.load('700 80px "Noto Serif SC"'),
          document.fonts.load('italic 22px "Noto Serif SC"'),
          document.fonts.load('italic 36px Lora'),
          document.fonts.load('400 18px Lora')
        ]);
        await document.fonts.ready;
        quoteFontsLoaded = true;
      } catch (e) {
        console.warn('Font load incomplete:', e);
      }
    }

    function wrapText(ctx, text, maxWidth) {
      if (!text) return [];
      // CJK-aware: 中文按字断,英文按词断
      const hasCJK = /[一-鿿]/.test(text);
      const tokens = hasCJK ? Array.from(text) : text.split(/(\s+)/);
      const lines = [];
      let line = '';
      for (const tok of tokens) {
        const test = line + tok;
        if (ctx.measureText(test).width > maxWidth && line.trim()) {
          lines.push(line.trim());
          line = tok.replace(/^\s+/, '');
        } else {
          line = test;
        }
      }
      if (line.trim()) lines.push(line.trim());
      return lines;
    }

    function drawBrandBar(ctx, label) {
      ctx.textAlign = 'center';
      ctx.fillStyle = COLOR.muted;
      ctx.font = 'italic 22px "Noto Serif SC", "Source Han Serif SC", serif';
      ctx.fillText(label, CARD_W / 2, 110);
    }

    function drawFooter(ctx, label) {
      ctx.textAlign = 'center';
      ctx.fillStyle = COLOR.faded;
      ctx.font = '400 18px Lora, Georgia, serif';
      ctx.fillText(label, CARD_W / 2, 1850);
    }

    function drawPhraseCard(ctx, card) {
      drawBrandBar(ctx, 'Readii · 英伦短文');
      ctx.textAlign = 'center';

      // English phrase
      ctx.fillStyle = COLOR.green;
      ctx.font = '600 64px Lora, Georgia, serif';
      const enLines = wrapText(ctx, card.english_phrase, 900);
      const enLH = 88;
      const enBlockH = enLines.length * enLH;
      const enStartY = 540 - enBlockH / 2 + enLH * 0.7;
      enLines.forEach((l, i) => ctx.fillText(l, CARD_W / 2, enStartY + i * enLH));
      let cursorY = enStartY + (enLines.length - 1) * enLH;

      // Phonetic respelling
      if (card.phonetic_respelling) {
        ctx.fillStyle = COLOR.gold;
        ctx.font = '500 40px "IBM Plex Mono", monospace';
        const phLines = wrapText(ctx, card.phonetic_respelling, 920);
        const phLH = 56;
        cursorY += 120;
        phLines.forEach((l, i) => ctx.fillText(l, CARD_W / 2, cursorY + i * phLH));
        cursorY += (phLines.length - 1) * phLH;
      }

      // Divider
      cursorY += 90;
      ctx.fillStyle = COLOR.divider;
      ctx.fillRect(CARD_W / 2 - 60, cursorY, 120, 1.5);

      // Chinese
      cursorY += 90;
      ctx.fillStyle = COLOR.body;
      ctx.font = '400 36px "Noto Serif SC", "Source Han Serif SC", serif';
      const zhLines = wrapText(ctx, card.chinese_translation, 920);
      const zhLH = 54;
      zhLines.forEach((l, i) => ctx.fillText(l, CARD_W / 2, cursorY + i * zhLH));
      cursorY += (zhLines.length - 1) * zhLH;

      // Cultural note
      if (card.cultural_note) {
        cursorY += 110;
        ctx.fillStyle = COLOR.muted;
        ctx.font = 'italic 26px "Noto Serif SC", "Source Han Serif SC", serif';
        const noteLines = wrapText(ctx, card.cultural_note, 880);
        const noteLH = 42;
        noteLines.forEach((l, i) => ctx.fillText(l, CARD_W / 2, cursorY + i * noteLH));
      }

      drawFooter(ctx, '@readii · 英国第 28 个月');
    }

    function drawCarouselCover(ctx, card) {
      drawBrandBar(ctx, 'Readii · 英伦观察');
      ctx.textAlign = 'center';

      // 中文反差钩子大字
      ctx.fillStyle = COLOR.green;
      ctx.font = '700 72px "Noto Serif SC", "Source Han Serif SC", serif';
      const zhLines = wrapText(ctx, card.chinese_translation, 900);
      const zhLH = 110;
      const zhBlockH = zhLines.length * zhLH;
      const zhStartY = CARD_H / 2 - zhBlockH / 2 - 80 + zhLH * 0.7;
      zhLines.forEach((l, i) => ctx.fillText(l, CARD_W / 2, zhStartY + i * zhLH));
      let cursorY = zhStartY + (zhLines.length - 1) * zhLH;

      // English smaller italic
      cursorY += 130;
      ctx.fillStyle = COLOR.body;
      ctx.font = 'italic 36px Lora, Georgia, serif';
      const enLines = wrapText(ctx, card.english_phrase, 900);
      const enLH = 54;
      enLines.forEach((l, i) => ctx.fillText(l, CARD_W / 2, cursorY + i * enLH));
      cursorY += (enLines.length - 1) * enLH;

      // Slide prompt(gold)
      if (card.cultural_note) {
        cursorY += 120;
        ctx.fillStyle = COLOR.gold;
        ctx.font = '500 28px "Noto Serif SC", "Source Han Serif SC", serif';
        const promptLines = wrapText(ctx, card.cultural_note, 900);
        const promptLH = 44;
        promptLines.forEach((l, i) => ctx.fillText(l, CARD_W / 2, cursorY + i * promptLH));
      }

      drawFooter(ctx, '@readii · 英音 + 英伦文化');
    }

    function drawPhonemeSpotlight(ctx, card) {
      drawBrandBar(ctx, 'Readii · 英音拼读法');
      ctx.textAlign = 'center';

      // Word(大字)
      ctx.fillStyle = COLOR.green;
      ctx.font = '700 120px Lora, Georgia, serif';
      ctx.fillText(card.english_phrase, CARD_W / 2, 460);

      // Phonetic boxed(核心视觉)
      const phStr = card.phonetic_respelling || '';
      ctx.font = '500 56px "IBM Plex Mono", monospace';
      const phWidth = ctx.measureText(phStr).width;
      const boxW = phWidth + 100;
      const boxH = 130;
      const boxX = CARD_W / 2 - boxW / 2;
      const boxY = 600;

      ctx.strokeStyle = COLOR.gold;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(boxX, boxY, boxW, boxH, 14);
      } else {
        ctx.rect(boxX, boxY, boxW, boxH);
      }
      ctx.stroke();

      ctx.fillStyle = COLOR.gold;
      ctx.font = '500 56px "IBM Plex Mono", monospace';
      ctx.fillText(phStr, CARD_W / 2, boxY + boxH / 2 + 20);

      // Chinese label
      ctx.fillStyle = COLOR.body;
      ctx.font = '400 40px "Noto Serif SC", "Source Han Serif SC", serif';
      ctx.fillText(card.chinese_translation, CARD_W / 2, 900);

      // Cultural note(可能含 \n)
      if (card.cultural_note) {
        ctx.fillStyle = COLOR.muted;
        ctx.font = 'italic 28px "Noto Serif SC", "Source Han Serif SC", serif';
        let y = 1100;
        const paragraphs = card.cultural_note.split('\n');
        const lineH = 46;
        paragraphs.forEach((para, pi) => {
          const wrapped = wrapText(ctx, para, 900);
          wrapped.forEach((l) => {
            ctx.fillText(l, CARD_W / 2, y);
            y += lineH;
          });
          if (pi < paragraphs.length - 1) y += 20;
        });
      }

      // Daisy hint
      ctx.fillStyle = COLOR.faded;
      ctx.font = 'italic 22px Lora, Georgia, serif';
      ctx.fillText('Daisy reads this in British accent', CARD_W / 2, 1740);

      drawFooter(ctx, '@readii');
    }

    async function drawQuoteCard(card) {
      await loadQuoteFonts();
      const canvas = document.createElement('canvas');
      canvas.width = CARD_W;
      canvas.height = CARD_H;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = COLOR.bg;
      ctx.fillRect(0, 0, CARD_W, CARD_H);

      if (card.type === 'phrase') drawPhraseCard(ctx, card);
      else if (card.type === 'carousel-cover') drawCarouselCover(ctx, card);
      else if (card.type === 'phoneme-spotlight') drawPhonemeSpotlight(ctx, card);

      return new Promise((resolve) => canvas.toBlob((blob) => resolve(blob), 'image/png'));
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    function paintThumb(slug, cardIndex, blob) {
      const thumb = document.querySelector(
        `.quote-thumb[data-slug="${slug}"][data-idx="${cardIndex}"]`
      );
      if (!thumb) return;
      const url = URL.createObjectURL(blob);
      thumb.classList.remove('pending');
      thumb.classList.add('done');
      thumb.innerHTML =
        `<img src="${url}" alt="card ${cardIndex}" style="width:100%;height:100%;object-fit:cover;display:block;">` +
        `<span class="quote-thumb-badge">${cardIndex}</span>` +
        `<a class="quote-thumb-dl" href="${url}" download="${slug}_card_${String(cardIndex).padStart(2, '0')}.png" onclick="event.stopPropagation()">⬇</a>`;
    }

    function cacheBlob(slug, cardIndex, blob) {
      if (!window.__cardCache) window.__cardCache = {};
      if (!window.__cardCache[slug]) window.__cardCache[slug] = {};
      window.__cardCache[slug][cardIndex] = blob;
    }

    async function generateSingleCardAndDownload(slug, cardIndex) {
      const cards = (window.QUOTE_CARDS || {})[slug] || [];
      const card = cards.find((c) => c.card_index === cardIndex);
      if (!card) return;
      const statusEl = document.getElementById(`quoteStatus-${slug}`);
      if (statusEl) {
        statusEl.textContent = `Rendering card ${cardIndex}…`;
        statusEl.className = 'status';
      }
      try {
        const blob = await drawQuoteCard(card);
        cacheBlob(slug, cardIndex, blob);
        paintThumb(slug, cardIndex, blob);
        triggerDownload(blob, `${slug}_card_${String(cardIndex).padStart(2, '0')}.png`);
        if (statusEl) {
          statusEl.textContent = `✓ Card ${cardIndex} downloaded`;
          statusEl.className = 'status ok';
        }
        maybeEnableZip(slug);
      } catch (e) {
        console.error(e);
        if (statusEl) {
          statusEl.textContent = `✗ Render failed: ${e.message}`;
          statusEl.className = 'status err';
        }
      }
    }
    window.generateSingleCardAndDownload = generateSingleCardAndDownload;

    async function generateAllQuoteCards(slug) {
      const cards = (window.QUOTE_CARDS || {})[slug] || [];
      if (!cards.length) return;
      const statusEl = document.getElementById(`quoteStatus-${slug}`);
      const zipBtn = document.getElementById(`zipBtn-${slug}`);
      if (statusEl) {
        statusEl.textContent = `Generating 0/${cards.length}…`;
        statusEl.className = 'status';
      }
      for (let i = 0; i < cards.length; i++) {
        const card = cards[i];
        try {
          const blob = await drawQuoteCard(card);
          cacheBlob(slug, card.card_index, blob);
          paintThumb(slug, card.card_index, blob);
        } catch (e) {
          console.error('Card render failed:', card.card_index, e);
        }
        if (statusEl) statusEl.textContent = `Generating ${i + 1}/${cards.length}…`;
      }
      if (statusEl) {
        statusEl.textContent = `✓ ${cards.length} cards ready · click any thumbnail to download, or ZIP for all`;
        statusEl.className = 'status ok';
      }
      if (zipBtn) zipBtn.disabled = false;
    }
    window.generateAllQuoteCards = generateAllQuoteCards;

    function maybeEnableZip(slug) {
      const cards = (window.QUOTE_CARDS || {})[slug] || [];
      const cache = (window.__cardCache || {})[slug] || {};
      if (Object.keys(cache).length === cards.length) {
        const zipBtn = document.getElementById(`zipBtn-${slug}`);
        if (zipBtn) zipBtn.disabled = false;
      }
    }

    async function downloadZipForArticle(slug) {
      const cache = (window.__cardCache || {})[slug];
      if (!cache || !Object.keys(cache).length) return;
      const statusEl = document.getElementById(`quoteStatus-${slug}`);
      if (statusEl) {
        statusEl.textContent = 'Packaging ZIP…';
        statusEl.className = 'status';
      }
      try {
        const zip = new JSZip();
        Object.keys(cache)
          .sort((a, b) => parseInt(a, 10) - parseInt(b, 10))
          .forEach((idx) => {
            zip.file(`${slug}_card_${String(idx).padStart(2, '0')}.png`, cache[idx]);
          });
        const content = await zip.generateAsync({ type: 'blob' });
        triggerDownload(content, `${slug}_quote_cards.zip`);
        if (statusEl) {
          statusEl.textContent = '✓ ZIP downloaded';
          statusEl.className = 'status ok';
        }
      } catch (e) {
        console.error(e);
        if (statusEl) {
          statusEl.textContent = `✗ ZIP failed: ${e.message}`;
          statusEl.className = 'status err';
        }
      }
    }
    window.downloadZipForArticle = downloadZipForArticle;

    // Preload fonts on first idle so first click is fast
    if (window.requestIdleCallback) {
      requestIdleCallback(() => loadQuoteFonts());
    } else {
      setTimeout(() => loadQuoteFonts(), 1500);
    }
  </script>
</body>
</html>
